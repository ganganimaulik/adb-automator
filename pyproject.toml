[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adbagent"
version = "0.1.0"
description = "Self-improving LLM-driven Android automation agent"
requires-python = ">=3.10"
dependencies = [
    "uiautomator2==3.7.0",
    "adbutils>=2.12.0",
    "openai>=2.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pillow>=10.0",
    "lxml>=5.0",
    "retry2>=0.9.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
adbagent = "adbagent.cli:main"

[tool.setuptools.packages.find]
include = ["adbagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
